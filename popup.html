<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Tab Volume Multiplier</h1>
      <div class="current-volume" id="currentVolume">100%</div>
    </div>

    <div class="volume-controls">
      <div class="slider-container">
        <input type="range" id="volumeSlider" min="0" max="500" value="100" class="slider">
        <div class="slider-labels">
          <span>0%</span>
          <span>100%</span>
          <span>200%</span>
          <span>300%</span>
          <span>400%</span>
          <span>500%</span>
        </div>
      </div>

      <div class="button-grid">
        <button id="muteButton" class="btn">
          <span class="btn-icon">🔇</span>
          Mute
        </button>
        <button id="resetButton" class="btn">
          <span class="btn-icon">↺</span>
          Reset
        </button>
        <button id="maxButton" class="btn">
          <span class="btn-icon">⚡</span>
          Max
        </button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
